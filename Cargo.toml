[workspace]
members = ["src/rust", "src/rust/core"]
resolver = "3"

[workspace.package]
# Also the Python package's version, through maturin.
version = "0.0.1"
edition = "2024"
# ruff_python_parser 0.0.20's minimum, the highest of the dependencies
rust-version = "1.97"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
