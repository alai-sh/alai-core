[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "alai-core"
dynamic = ["version"]
description = "Core functions and helpers used by the various alai tools."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordan Borean" }]
requires-python = ">=3.10"
keywords = ["alai", "ansible", "collections", "galaxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

dependencies = []

[project.urls]
Source = "https://github.com/alai-sh/alai-core"
Issues = "https://github.com/alai-sh/alai-core/issues"

[dependency-groups]
# Installed on its own by CI's musl job.
test = [
    "pytest >= 8",
    "pytest-xdist",
]
dev = [
    { include-group = "test" },
    "basedpyright >= 1.40.2",
    "coverage[toml] >= 5.3",  # Support for source_pkgs
    "ruff >= 0.17.0",
    "pre-commit",
    "tox-uv",
]

[tool.uv]
# Rebuild on any source change, the Rust included, not only on pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.pyi" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/rust/**/Cargo.toml" },
    { file = "src/rust/**/*.rs" },
]

[tool.maturin]
manifest-path = "src/rust/Cargo.toml"
module-name = "alai_core._native"
python-source = "src"
python-packages = ["alai_core"]
features = ["pyo3/extension-module"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.10"
exclude = ["tests"]
reportAny = false
# typing.override needs 3.12.
reportImplicitOverride = false
# The built extension only exists in src/ after uv sync, so its stub is what's checked.
reportMissingModuleSource = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownMemberType = false

executionEnvironments = [
    { root = "tests", reportUntypedFunctionDecorator = false }
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "PERF",
    "PIE",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
    "W",
]

ignore = [
    # Conflicts with basedpyright's reportImplicitStringConcatenation.
    "ISC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF012"]
# pathlib's import cost would land on every alai command.
"src/**" = ["PTH"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["typing", "collections.abc"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"typing" = "_t"
"collections.abc" = "_c"

[tool.ruff.lint.isort]
known-first-party = ["alai_core"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
testpaths = "tests"
junit_family = "xunit2"

[tool.coverage.paths]
source = ["src", ".tox/py*/**/site-packages"]

[tool.coverage.run]
branch = true
# The tests run from another directory.
data_file = "${PROJECT_ROOT}/.coverage"
disable_warnings = ["module-not-imported", "no-data-collected"]
source_pkgs = ["alai_core"]
parallel = true

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
    sanity
    py3{10,11,12,13,14,15}-tests
    py3{14,15}t-tests
min_version = 4.0

[testenv]
package = wheel
wheel_build_env = .pkg
runner = uv-venv-lock-runner

passenv =
    PYTEST_ADDOPTS

set_env =
    tests: COVERAGE_PROCESS_START={toxinidir}/pyproject.toml
    tests: PROJECT_ROOT={toxinidir}

commands_pre =
    # Not {env_site_packages_dir}, which misses the "t" in a free-threaded build's lib/python3.14t.
    tests: python -c 'import pathlib, sysconfig; pathlib.Path(sysconfig.get_path("purelib"), "cov.pth").write_text("import coverage; coverage.process_startup()")'

commands =
    sanity: python -m ruff check .
    sanity: python -m ruff format . --check
    sanity: python -m basedpyright --warnings
    sanity: cargo fmt --check
    sanity: cargo clippy --release --quiet -- --deny warnings
    sanity: cargo test --package alai-core --quiet
    tests: python -m coverage run -m pytest -v {posargs:-n auto}

commands_post =
    tests: python -m coverage combine --quiet
    tests: python -m coverage report
    tests: python -m coverage xml

[testenv:sanity]
base_python = py315
allowlist_externals = cargo
"""
